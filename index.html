<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx_ZEVROJ54-oRWN_gs4b2Vry5ia3_CWfp-vBxzzwBZUxCMRN8SEZr1cxJYqFwtyFlr/exec";
const AVATAR_COLORS = ['from-red-500 to-red-700','from-blue-500 to-blue-700','from-amber-500 to-orange-600',
  'from-slate-500 to-slate-700','from-teal-500 to-teal-700','from-violet-500 to-violet-700',
  'from-emerald-500 to-emerald-700','from-pink-500 to-rose-600'];

let currentTeam = null;
let currentPerson = null;
let selectedReplacement = null;

function updateClock() {
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const weekday = ['日','一','二','三','四','五','六'][now.getDay()];
  document.getElementById('date').textContent = `${now.getFullYear()}年${pad(now.getMonth()+1)}月${pad(now.getDate())}日 星期${weekday}`;
}
setInterval(updateClock, 1000);
updateClock();

function colorFor(team, role, slot) {
  const idx = (team.charCodeAt(0) + role.length + Number(slot)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[idx];
}

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.querySelector('svg').classList.toggle('text-emerald-400', ok !== false);
  t.querySelector('svg').classList.toggle('text-red-400', ok === false);
  t.classList.remove('translate-y-20','opacity-0');
  setTimeout(() => t.classList.add('translate-y-20','opacity-0'), 3500);
}

async function loadRoster() {
  document.getElementById('content').innerHTML = '<div class="text-center py-20 text-slate-400">載入中...</div>';
  try {
    const res = await fetch(`${API_URL}?action=roster`);
    const json = await res.json();
    if (!json.ok) throw new Error('load failed');
    currentTeam = json.team;
    lastRosterJson = json;
    renderStatus(json);
    renderRoster(json);
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="text-center py-20 text-red-500">載入失敗，請按上方「刷新編組」再試一次</div>';
  }
}

let currentEmergencyActive = false;
let emergencyStartAtGlobal = null;

function formatDuration_(ms) {
  const totalMin = Math.floor(ms / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  let out = '';
  if (days > 0) out += days + '天';
  if (days > 0 || hours > 0) out += hours + '小時';
  out += mins + '分';
  return out;
}

function updateEmergencyDuration() {
  const el = document.getElementById('emergencyDuration');
  if (!el) return;
  if (!currentEmergencyActive || !emergencyStartAtGlobal) { el.textContent = ''; return; }
  const elapsed = Date.now() - new Date(emergencyStartAtGlobal).getTime();
  el.textContent = elapsed >= 0 ? '・已開設 ' + formatDuration_(elapsed) : '';
}
setInterval(updateEmergencyDuration, 1000);

function renderStatus(json) {
  document.getElementById('currentTeamLabel').textContent = json.team + ' 班';
  document.getElementById('totalCount').textContent = json.rows.length;
  currentEmergencyActive = json.emergencyActive;
  emergencyStartAtGlobal = json.emergencyStartAt || null;
  const dot = document.getElementById('statusDot');
  const ping = document.getElementById('statusPing');
  const text = document.getElementById('statusText');
  const btn = document.getElementById('emergencyBtn');
  const btnText = document.getElementById('emergencyBtnText');
  if (json.emergencyActive) {
    dot.className = 'relative inline-flex rounded-full h-3 w-3 bg-red-500';
    ping.className = 'absolute inline-flex h-full w-full rounded-full opacity-75 bg-red-400 animate-ping';
    const startStr = json.emergencyStartAt ? new Date(json.emergencyStartAt).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
    text.innerHTML = '應變開設中' + (startStr ? '（' + startStr + '起）' : '') + '<span id="emergencyDuration"></span>';
    text.className = 'font-semibold text-red-600';
    btn.className = 'bg-slate-600 hover:bg-slate-700 text-white text-sm font-medium px-3.5 py-2 rounded-lg transition-colors shadow-sm flex items-center gap-2 active:scale-95';
    btnText.textContent = '解除';
    updateEmergencyDuration();
  } else {
    dot.className = 'relative inline-flex rounded-full h-3 w-3 bg-emerald-500';
    ping.className = 'absolute inline-flex h-full w-full rounded-full opacity-75 bg-emerald-400 animate-ping';
    const endStr = json.emergencyEndAt ? new Date(json.emergencyEndAt).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
    text.textContent = '尚未開設・預告班表' + (endStr ? '（上次解除：' + endStr + '）' : '');
    text.className = 'font-semibold text-emerald-600';
    btn.className = 'bg-orange-600 hover:bg-orange-700 text-white text-sm font-medium px-3.5 py-2 rounded-lg transition-colors shadow-sm flex items-center gap-2 active:scale-95';
    btnText.textContent = '開設';
  }
  renderRotationPreview(json);
}

function renderRotationPreview(json) {
  const label = document.getElementById('previewLabel');
  const el = document.getElementById('rotationPreview');
  if (!json.rotationPreview || !json.rotationPreview.length) {
    el.textContent = '無資料';
    return;
  }
  label.textContent = json.emergencyActive
    ? '未來3天預覽（假設此次應變持續開設）：'
    : '未來3天預覽（假設現在開設）：';
  el.textContent = json.rotationPreview.map(p => `${p.date} ${p.team}班`).join('　→　');
}

function taipeiLocalInputValue_() {
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  const pad = n => String(n).padStart(2, '0');
  return `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

function openEmergencyModal() {
  if (currentEmergencyActive) {
    document.getElementById('emergencyModalTitle').textContent = '解除應變編組';
    document.getElementById('emergencyTimeLabel').textContent = '解除時間（可調整）';
    document.getElementById('emergencyConfirmBtn').textContent = '確認解除';
  } else {
    document.getElementById('emergencyModalTitle').textContent = '開設應變編組';
    document.getElementById('emergencyTimeLabel').textContent = '開設時間（可調整）';
    document.getElementById('emergencyConfirmBtn').textContent = '確認開設';
  }
  document.getElementById('emergencyStartInput').value = taipeiLocalInputValue_();
  document.getElementById('emergencyModal').classList.remove('hidden');
}
function closeEmergencyModal() {
  document.getElementById('emergencyModal').classList.add('hidden');
}
async function confirmEmergencyAction() {
  const val = document.getElementById('emergencyStartInput').value;
  if (!val) { showToast('請選擇時間', false); return; }
  const opening = !currentEmergencyActive;
  const label = opening ? '開設' : '解除';
  if (!confirm(`再次確認：真的要${label}應變編組嗎？`)) return;
  // datetime-local輸入視為台灣時間，補上+08:00時區
  const timeAt = val + ':00+08:00';
  const payload = opening
    ? { action: 'set_emergency', active: true, startAt: timeAt }
    : { action: 'set_emergency', active: false, endAt: timeAt };
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    closeEmergencyModal();
    showToast(json.ok ? `已${label}應變編組` : '操作失敗', json.ok);
    loadRoster();
  } catch (e) {
    closeEmergencyModal();
    showToast('操作失敗，請稍後再試', false);
  }
}

function openPushModal() {
  document.getElementById('pushPasswordInput').value = '';
  document.getElementById('pushModal').classList.remove('hidden');
}
function closePushModal() {
  document.getElementById('pushModal').classList.add('hidden');
}
async function confirmPushRoster() {
  const password = document.getElementById('pushPasswordInput').value;
  if (!password) { showToast('請輸入密碼', false); return; }
  try {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'push_roster', team: currentTeam, password })
    });
    const json = await res.json();
    closePushModal();
    if (json.ok) {
      showToast('已推播班表到LINE');
    } else if (json.error === 'wrong_password') {
      showToast('密碼錯誤', false);
    } else {
      showToast('推播失敗：' + (json.error || '請稍後再試'), false);
    }
  } catch (e) {
    closePushModal();
    showToast('推播失敗，請稍後再試', false);
  }
}

function renderRoster(json) {
  const grouped = {};
  json.rows.forEach(r => {
    if (!grouped[r.roleCategory]) grouped[r.roleCategory] = [];
    grouped[r.roleCategory].push(r);
  });

  let html = '';
  json.roleOrder.forEach(role => {
    const people = grouped[role];
    if (!people) return;
    html += `<div class="mb-8">
      <h2 class="text-sm font-bold text-slate-500 tracking-wide mb-3 flex items-center gap-2">
        <span class="w-1.5 h-4 bg-red-600 rounded-full inline-block"></span>${role}
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">`;

    people.forEach((p, i) => {
      const color = colorFor(p.team, p.roleCategory, p.slotIndex);
      html += `
        <div class="card-enter bg-white rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-red-300 transition-all cursor-pointer group"
             style="animation-delay:${i * 0.04}s"
             onclick='openShiftModal(${JSON.stringify(p.team)}, ${JSON.stringify(p.roleCategory)}, ${p.slotIndex}, ${JSON.stringify(p.name)}, ${JSON.stringify(p.phone)})'>
          <div class="p-4 flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br ${color} flex items-center justify-center text-white font-bold text-lg shadow-sm flex-shrink-0">
              ${p.name[0]}
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="font-bold text-slate-900 truncate">${p.name}</h3>
              <p class="text-sm text-slate-500 font-mono">${p.phone || '未登記電話'}</p>
            </div>
          </div>
          <div class="px-4 py-2.5 bg-slate-50 rounded-b-xl border-t border-slate-100 flex items-center justify-between group-hover:bg-red-50 transition-colors">
            <span class="text-xs text-slate-500 font-medium">點擊申請換班</span>
            <svg class="w-4 h-4 text-slate-400 group-hover:text-red-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </div>
        </div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('content').innerHTML = html;
}

async function openShiftModal(team, role, slot, name, phone) {
  currentPerson = { team, role, slot, name, phone };
  selectedReplacement = null;
  const modal = document.getElementById('shiftModal');
  const originalDiv = document.getElementById('originalPerson');
  const listDiv = document.getElementById('replacementList');
  const color = colorFor(team, role, slot);

  originalDiv.innerHTML = `
    <div class="w-10 h-10 rounded-full bg-gradient-to-br ${color} flex items-center justify-center text-white font-bold flex-shrink-0">${name[0]}</div>
    <div>
      <p class="font-bold text-slate-900">${name}</p>
      <p class="text-xs text-slate-500">${team}班 · ${role}</p>
    </div>`;

  listDiv.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">載入候選人中...</p>';
  modal.classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  try {
    const res = await fetch(`${API_URL}?action=candidates&role=${encodeURIComponent(role)}&excludeTeam=${team}&excludeSlot=${slot}`);
    const json = await res.json();
    if (!json.ok || !json.candidates.length) {
      listDiv.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">暫無可代班的相同職務人員</p>';
      return;
    }
    listDiv.innerHTML = json.candidates.map(c => {
      const cColor = colorFor(c.team, c.roleCategory, c.slotIndex);
      return `
        <div onclick="selectReplacement(this, '${c.team}', '${c.slotIndex}')"
             class="replacement-item flex items-center gap-3 p-3 rounded-lg border-2 border-slate-200 hover:border-slate-300 cursor-pointer transition-colors">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br ${cColor} flex items-center justify-center text-white font-bold flex-shrink-0">${c.name[0]}</div>
          <div class="flex-1 min-w-0">
            <p class="font-bold text-slate-900">${c.name}</p>
            <p class="text-xs text-slate-500">${c.team}班 · ${c.roleCategory}</p>
          </div>
          <div class="check-circle w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center flex-shrink-0 transition-colors">
            <svg class="w-3 h-3 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    listDiv.innerHTML = '<p class="text-sm text-red-400 text-center py-4">載入失敗，請重新開啟</p>';
  }
}

function selectReplacement(el, team, slot) {
  selectedReplacement = { team, slot };
  document.querySelectorAll('.replacement-item').forEach(item => {
    item.classList.remove('border-red-500', 'bg-red-50');
    item.classList.add('border-slate-200');
    const circle = item.querySelector('.check-circle');
    circle.classList.remove('bg-red-600', 'border-red-600');
    circle.classList.add('border-slate-300');
    circle.querySelector('svg').classList.add('hidden');
  });
  el.classList.remove('border-slate-200');
  el.classList.add('border-red-500', 'bg-red-50');
  const circle = el.querySelector('.check-circle');
  circle.classList.remove('border-slate-300');
  circle.classList.add('bg-red-600', 'border-red-600');
  circle.querySelector('svg').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('shiftModal').classList.add('hidden');
  document.body.style.overflow = '';
}

async function confirmShift() {
  if (!selectedReplacement) {
    showToast('請先選擇代班人', false);
    return;
  }
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'swap_submit',
        team: currentPerson.team,
        role: currentPerson.role,
        slot: currentPerson.slot,
        replacementTeam: selectedReplacement.team,
        replacementSlot: selectedReplacement.slot
      })
    });
    const json = await res.json();
    closeModal();
    showToast(json.ok ? json.message : ('送出失敗：' + (json.error || '請稍後再試')), json.ok);
  } catch (e) {
    closeModal();
    showToast('送出失敗，請稍後再試', false);
  }
}


function buildRosterText(json) {
  const grouped = {};
  json.rows.forEach(r => {
    if (!grouped[r.roleCategory]) grouped[r.roleCategory] = [];
    grouped[r.roleCategory].push(r);
  });
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  const pad = n => String(n).padStart(2,'0');
  const dateStr = `${now.getFullYear()}年${pad(now.getMonth()+1)}月${pad(now.getDate())}日`;
  let lines = [`🚒 二大應變編組表`, `${dateStr}｜${json.team}班`, ''];
  json.roleOrder.forEach(role => {
    const people = grouped[role];
    if (!people) return;
    lines.push(`${role}：${people.map(p => p.name).join('、')}`);
  });
  lines.push('', '—— 二大應變編組系統');
  return lines.join('\n');
}

let lastRosterJson = null;

function pad2_(n) { return String(n).padStart(2, '0'); }

function taipeiNow_() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
}

function buildPdfHtml_(json) {
  const grouped = {};
  json.rows.forEach(r => {
    if (!grouped[r.roleCategory]) grouped[r.roleCategory] = [];
    grouped[r.roleCategory].push(r);
  });
  const now = taipeiNow_();
  const dateStr = `${now.getFullYear()}年${pad2_(now.getMonth() + 1)}月${pad2_(now.getDate())}日`;
  const timeStr = `${pad2_(now.getHours())}:${pad2_(now.getMinutes())}`;
  const statusText = json.emergencyActive
    ? `● 應變開設中${json.emergencyStartAt ? '（' + new Date(json.emergencyStartAt).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' 起）' : ''}`
    : '○ 尚未開設・預告班表';

  const rolesWithPeople = json.roleOrder.filter(r => grouped[r]);
  const mid = Math.ceil(rolesWithPeople.length / 2);
  const leftRoles = rolesWithPeople.slice(0, mid);
  const rightRoles = rolesWithPeople.slice(mid);

  function renderRoleBlock(role) {
    const rows = grouped[role].map(p => `
      <div style="display:flex;justify-content:space-between;padding:5px 10px;border-bottom:1px solid #f1d9d9;font-size:13px;">
        <span style="color:#1e293b;">${p.name}</span>
        <span style="color:#64748b;">${p.phone || ''}</span>
      </div>`).join('');
    return `
      <div style="margin-bottom:12px;">
        <div style="background:#fef2f2;border-left:4px solid #dc2626;padding:5px 10px;font-size:13px;font-weight:700;color:#991b1b;">${role}</div>
        ${rows}
      </div>`;
  }

  const leftHtml = leftRoles.map(renderRoleBlock).join('');
  const rightHtml = rightRoles.map(renderRoleBlock).join('');

  return `
    <div style="width:754px;padding:20px;font-family:'Noto Sans TC',sans-serif;background:#fff;color:#1e293b;">
      <div style="background:linear-gradient(90deg,#b91c1c,#ea580c);border-radius:10px;padding:18px 22px;color:#fff;margin-bottom:16px;">
        <div style="font-size:20px;font-weight:900;">🚒 二大應變編組表</div>
        <div style="font-size:12px;opacity:.9;margin-top:2px;">臺北市政府消防局 第二救災救護大隊・Z-TEAM</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;">
          <div style="font-size:13px;">${dateStr}（列印時間 ${timeStr}）｜目前編組：<b style="font-size:16px;">${json.team}班</b></div>
          <div style="font-size:12px;">${statusText}</div>
        </div>
      </div>
      <div style="display:flex;gap:20px;">
        <div style="flex:1;">${leftHtml}</div>
        <div style="flex:1;">${rightHtml}</div>
      </div>
    </div>`;
}

async function exportRoster() {
  if (!lastRosterJson) { showToast('請先等編組載入完成', false); return; }
  const root = document.getElementById('pdfExportRoot');
  root.innerHTML = buildPdfHtml_(lastRosterJson);
  await new Promise(r => setTimeout(r, 50));
  try {
    const canvas = await html2canvas(root.firstElementChild, { scale: 2, backgroundColor: '#ffffff' });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgW = pageWidth - 20;
    const imgH = (canvas.height * imgW) / canvas.width;
    if (imgH <= pageHeight - 20) {
      pdf.addImage(imgData, 'PNG', 10, 10, imgW, imgH);
    } else {
      const scaledH = pageHeight - 20;
      const scaledW = (canvas.width * scaledH) / canvas.height;
      pdf.addImage(imgData, 'PNG', (pageWidth - scaledW) / 2, 10, scaledW, scaledH);
    }
    const now = taipeiNow_();
    const fileDate = `${now.getFullYear()}${pad2_(now.getMonth() + 1)}${pad2_(now.getDate())}`;
    pdf.save(`二大應變編組_${lastRosterJson.team}班_${fileDate}.pdf`);
    showToast('已匯出PDF班表');
  } catch (e) {
    showToast('PDF產生失敗：' + e.message, false);
  } finally {
    root.innerHTML = '';
  }
}

async function shareRoster() {
  if (!lastRosterJson) { showToast('請先等編組載入完成', false); return; }
  const text = buildRosterText(lastRosterJson);
  if (navigator.share) {
    try {
      await navigator.share({ title: '二大應變編組表', text });
      return;
    } catch (e) {
      return; // user cancelled share sheet
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('此裝置不支援分享，已複製班表文字，可直接貼到LINE');
  } catch (e) {
    showToast('分享失敗，請改用「匯出班表」下載', false);
  }
}

loadRoster();
</script>
<div id="pdfExportRoot" style="position:fixed;left:-9999px;top:0;"></div>
</div>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二大應變編組</title>
<style>
  :root {
    --bg:#f5f6f8; --bg2:#ffffff; --card:#ffffff; --card2:#fff7f6;
    --border:#e2e5e9; --text:#20242c; --muted:#68707d; --accent:#b42318;
    --accent2:#b42318; --good:#16834b;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); margin:0; padding:0 0 40px; min-height:100vh;
    border-top:5px solid var(--accent);
  }
  header {
    padding:24px 16px 18px; text-align:left; background:#fff; border-bottom:1px solid var(--border);
  }
  header > * { max-width:520px; margin-left:auto !important; margin-right:auto !important; }
  header .badge {
    display:block; font-size:11px; letter-spacing:.12em; color:var(--accent2);
    background:transparent; padding:0; border-radius:0; margin-bottom:5px !important; font-weight:700;
  }
  h1 { font-size:22px; margin-top:0 !important; margin-bottom:5px !important; font-weight:750; }
  .sub { color:var(--muted); font-size:13px; }

  .status-bar {
    max-width:520px; margin:18px auto 10px; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
    box-shadow:0 2px 8px rgba(20,28,40,.04);
  }
  .status-left .team-label { font-size:12px; color:var(--muted); margin-bottom:3px; }
  .status-left .team-value { font-size:26px; font-weight:800; color:var(--accent2); }
  .status-right { text-align:right; font-size:12px; color:var(--muted); }
  .status-right .now-time { font-size:16px; color:var(--text); font-weight:650; margin-bottom:2px; font-variant-numeric:tabular-nums; }
  .emergency-row {
    max-width:520px; margin:0 auto 20px; padding:10px 4px; display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--muted);
  }
  .emergency-dot { width:8px; height:8px; border-radius:50%; background:#98a0ac; flex-shrink:0; }
  .emergency-dot.active { background:var(--good); box-shadow:0 0 0 4px rgba(22,131,75,.1); }

  main { max-width:520px; margin:0 auto; padding:0 16px; }
  .role-group {
    margin-bottom:12px; background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden;
  }
  .role-title {
    font-size:12px; color:#4f5866; font-weight:700; letter-spacing:.03em;
    margin:0; padding:9px 14px; display:flex; align-items:center; gap:0;
    background:#f9fafb; border-bottom:1px solid var(--border);
  }
  .role-title::before { display:none; }
  .person-card {
    background:var(--card); border:0; border-bottom:1px solid #edf0f2; border-radius:0;
    padding:13px 14px; margin:0; display:flex; align-items:center;
    justify-content:space-between; cursor:pointer; transition:background .15s;
    min-height:58px;
  }
  .person-card:last-child { border-bottom:0; }
  .person-card:hover { background:#fcfcfd; }
  .person-card:active { background:var(--card2); transform:none; }
  .person-info { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .person-name { font-size:15px; font-weight:650; }
  .person-phone { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .swap-hint {
    font-size:12px; color:var(--accent2); background:transparent; padding:6px 2px 6px 12px;
    border-radius:0; white-space:nowrap; font-weight:700;
  }
  .swap-hint::after { content:' ›'; font-size:18px; font-weight:400; vertical-align:-1px; }

  .loading { text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }

  .modal-bg {
    display:none; position:fixed; inset:0; background:rgba(20,27,38,.55); backdrop-filter:none;
    align-items:center; justify-content:center; z-index:10; padding:16px;
  }
  .modal-bg.open { display:flex; }
  .modal {
    background:var(--card); border-radius:12px; padding:22px 20px 24px;
    width:100%; max-width:440px; max-height:calc(100vh - 32px); overflow:auto;
    box-shadow:0 18px 48px rgba(16,24,40,.18); animation:slideUp .18s ease-out;
  }
  @keyframes slideUp { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .modal h2 { font-size:18px; margin:0 0 14px; }
  .modal .info {
    background:#fff5f3; border:0; padding:11px 13px; border-radius:8px;
    font-size:13px; color:#912018; margin-bottom:16px;
  }
  .modal label { display:block; font-size:12px; color:#4f5866; margin:12px 0 5px; font-weight:650; }
  .modal input {
    width:100%; min-height:46px; padding:11px 12px; border-radius:8px; border:1px solid #cfd4dc;
    background:#fff; color:var(--text); font-size:15px;
  }
  .modal input:focus { outline:3px solid rgba(180,35,24,.12); border-color:var(--accent); }
  .modal select { width:100%; min-height:46px; padding:11px 12px; border-radius:8px; border:1px solid #cfd4dc; background:#fff; color:var(--text); font-size:15px; }
  .modal select:focus { outline:3px solid rgba(180,35,24,.12); border-color:var(--accent); }
  .modal .actions { display:flex; gap:10px; margin-top:22px; }
  .modal button { flex:1; min-height:44px; padding:11px; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-submit { background:var(--accent); color:#fff; }
  .btn-cancel { background:#fff; color:#4f5866; border:1px solid #cfd4dc !important; }

  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#20242c; color:#fff; border:0; padding:12px 18px;
    border-radius:8px; font-size:14px; display:none; max-width:88%; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:20;
  }

  @media (max-width:560px) {
    header { padding:18px 16px 14px; }
    h1 { font-size:19px; }
    .status-bar { margin:14px 14px 6px; padding:14px 15px; }
    .emergency-row { margin:0 14px 15px; padding:9px 1px; }
    main { padding:0 14px; }
    .role-group { margin-bottom:10px; }
    .modal-bg { padding:0; align-items:flex-end; }
    .modal { max-width:none; max-height:92vh; border-radius:14px 14px 0 0; padding-bottom:max(24px,env(safe-area-inset-bottom)); }
  }

  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
  <header>
    <div class="badge">TAIPEI FIRE · 應變編組</div>
    <h1>🚒 二大應變編組</h1>
    <div class="sub">點人員卡片可申請換班</div>
  </header>

  <div class="status-bar">
    <div class="status-left">
      <div class="team-label">目前編組</div>
      <div class="team-value" id="teamValue">— 班</div>
    </div>
    <div class="status-right">
      <div class="now-time" id="nowTime">--:--:--</div>
      <div id="nowDate">----年--月--日</div>
    </div>
  </div>
  <div class="emergency-row">
    <div class="emergency-dot" id="emergencyDot"></div>
    <div id="emergencyText">尚未開設</div>
  </div>

  <main id="content" class="loading">載入中...</main>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>申請換班</h2>
      <div class="info" id="modalInfo"></div>
      <label>選擇代班人（僅列出相同職務人員）</label>
      <select id="fCandidate"><option value="">載入中...</option></select>
      <div class="actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-submit" onclick="submitSwap()">送出申請</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx_ZEVROJ54-oRWN_gs4b2Vry5ia3_CWfp-vBxzzwBZUxCMRN8SEZr1cxJYqFwtyFlr/exec";
let currentTeam = "A";
let currentContext = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 4000);
}

function taipeiNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
}

function updateClock() {
  const now = taipeiNow();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('nowTime').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('nowDate').textContent = `${now.getFullYear()}年${pad(now.getMonth()+1)}月${pad(now.getDate())}日`;
}
setInterval(updateClock, 1000);
updateClock();

function renderStatus(json) {
  document.getElementById('teamValue').textContent = json.team + ' 班';
  const dot = document.getElementById('emergencyDot');
  const text = document.getElementById('emergencyText');
  if (json.emergencyActive) {
    dot.classList.add('active');
    const startAt = json.emergencyStartAt ? new Date(json.emergencyStartAt) : null;
    const startStr = startAt ? new Date(startAt.toLocaleString('en-US', { timeZone: 'Asia/Taipei' }))
      .toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
    text.textContent = '應變已開設' + (startStr ? `（開設時間 ${startStr}）` : '');
  } else {
    dot.classList.remove('active');
    text.textContent = '尚未開設，目前為預告班表';
  }
}

async function loadRoster() {
  document.getElementById('content').innerHTML = '<div class="loading">載入中...</div>';
  try {
    const res = await fetch(`${API_URL}?action=roster`);
    const json = await res.json();
    if (!json.ok) throw new Error('load failed');
    currentTeam = json.team;
    renderStatus(json);
    renderRoster(json);
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="loading">載入失敗，稍後再試</div>';
  }
}

function renderRoster(json) {
  const grouped = {};
  json.rows.forEach(r => {
    if (!grouped[r.roleCategory]) grouped[r.roleCategory] = [];
    grouped[r.roleCategory].push(r);
  });
  let html = '';
  json.roleOrder.forEach(role => {
    const people = grouped[role];
    if (!people) return;
    html += `<div class="role-group"><div class="role-title">${role}</div>`;
    people.forEach(p => {
      const phoneHtml = p.phone ? `<div class="person-phone">📞 ${p.phone}</div>` : '';
      html += `
        <div class="person-card" onclick='openModal(${JSON.stringify(json.team)}, ${JSON.stringify(role)}, ${p.slotIndex}, ${JSON.stringify(p.name)})'>
          <div class="person-info">
            <div class="person-name">${p.name}</div>
            ${phoneHtml}
          </div>
          <div class="swap-hint">換班</div>
        </div>`;
    });
    html += '</div>';
  });
  document.getElementById('content').innerHTML = html;
}

async function openModal(team, role, slot, name) {
  currentContext = { team, role, slot, name };
  document.getElementById('modalInfo').textContent = `${team}班「${role}」目前是：${name}`;
  const select = document.getElementById('fCandidate');
  select.innerHTML = '<option value="">載入中...</option>';
  document.getElementById('modalBg').classList.add('open');
  try {
    const res = await fetch(`${API_URL}?action=candidates&role=${encodeURIComponent(role)}&excludeTeam=${team}&excludeSlot=${slot}`);
    const json = await res.json();
    if (!json.ok || !json.candidates.length) {
      select.innerHTML = '<option value="">目前沒有相同職務的其他人可選</option>';
      return;
    }
    select.innerHTML = json.candidates.map(c =>
      `<option value="${c.team}|${c.slotIndex}">${c.team}班 ${c.name}</option>`
    ).join('');
  } catch (e) {
    select.innerHTML = '<option value="">載入失敗，請重新開啟</option>';
  }
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}

async function submitSwap() {
  const val = document.getElementById('fCandidate').value;
  if (!val) {
    showToast('請選擇代班人');
    return;
  }
  const [replacementTeam, replacementSlot] = val.split('|');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'swap_submit',
        team: currentContext.team,
        role: currentContext.role,
        slot: currentContext.slot,
        replacementTeam, replacementSlot
      })
    });
    const json = await res.json();
    closeModal();
    showToast(json.ok ? json.message : '送出失敗：' + (json.error || '請稍後再試'));
  } catch (e) {
    closeModal();
    showToast('送出失敗，請稍後再試');
  }
}

loadRoster();
</script>
</body>
</html>

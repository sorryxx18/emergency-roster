<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC應變編組表</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#2563eb; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--text); margin:0; padding:16px; }
  h1 { font-size:20px; text-align:center; margin:8px 0 4px; }
  .sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:20px; }
  .team-switch { display:flex; justify-content:center; gap:8px; margin-bottom:16px; }
  .team-switch button { padding:8px 18px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px; cursor:pointer; }
  .team-switch button.active { background:var(--accent); border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:14px; }
  th { background:var(--bg); color:var(--muted); font-weight:600; }
  .role-cell { color:var(--muted); width:100px; vertical-align:top; }
  .name-cell { cursor:pointer; }
  .name-cell:active { background:#475569; }
  .loading { text-align:center; color:var(--muted); padding:40px; }

  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:center; justify-content:center; padding:16px; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--card); border-radius:12px; padding:20px; width:100%; max-width:380px; }
  .modal h2 { font-size:16px; margin:0 0 12px; }
  .modal .info { background:var(--bg); padding:10px; border-radius:8px; font-size:13px; color:var(--muted); margin-bottom:14px; }
  .modal label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .modal input { width:100%; padding:10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; }
  .modal .actions { display:flex; gap:10px; margin-top:18px; }
  .modal button { flex:1; padding:11px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn-submit { background:var(--accent); color:#fff; }
  .btn-cancel { background:var(--border); color:var(--text); }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--border); padding:12px 20px; border-radius:8px; font-size:14px; display:none; max-width:90%; text-align:center; }
</style>
</head>
<body>
  <h1>🚒 應變編組表</h1>
  <div class="sub">點姓名可申請換人</div>
  <div class="team-switch" id="teamSwitch"></div>
  <div id="content" class="loading">載入中...</div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>申請換人</h2>
      <div class="info" id="modalInfo"></div>
      <label>代班人姓名</label>
      <input type="text" id="fName">
      <label>代班人電話</label>
      <input type="tel" id="fPhone">
      <label>代班人Email（確認信會寄到這裡）</label>
      <input type="email" id="fEmail">
      <div class="actions">
        <button class="btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn-submit" onclick="submitSwap()">送出申請</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx_ZEVROJ54-oRWN_gs4b2Vry5ia3_CWfp-vBxzzwBZUxCMRN8SEZr1cxJYqFwtyFlr/exec";
let currentTeam = "A";
let currentContext = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 4000);
}

function renderTeamSwitch() {
  const wrap = document.getElementById('teamSwitch');
  wrap.innerHTML = ['A', 'B', 'C'].map(t =>
    `<button class="${t === currentTeam ? 'active' : ''}" onclick="loadRoster('${t}')">${t}班</button>`
  ).join('');
}

async function loadRoster(team) {
  currentTeam = team;
  renderTeamSwitch();
  document.getElementById('content').innerHTML = '<div class="loading">載入中...</div>';
  try {
    const res = await fetch(`${API_URL}?action=roster&team=${team}`);
    const json = await res.json();
    if (!json.ok) throw new Error('load failed');
    renderRoster(json);
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="loading">載入失敗，稍後再試</div>';
  }
}

function renderRoster(json) {
  const grouped = {};
  json.rows.forEach(r => {
    if (!grouped[r.roleCategory]) grouped[r.roleCategory] = [];
    grouped[r.roleCategory].push(r);
  });
  let rowsHtml = '';
  json.roleOrder.forEach(role => {
    const people = grouped[role];
    if (!people) return;
    people.forEach((p, i) => {
      rowsHtml += '<tr>';
      if (i === 0) rowsHtml += `<td class="role-cell" rowspan="${people.length}">${role}</td>`;
      rowsHtml += `<td class="name-cell" onclick='openModal(${JSON.stringify(json.team)}, ${JSON.stringify(role)}, ${p.slotIndex}, ${JSON.stringify(p.name)})'>${p.name}</td>`;
      rowsHtml += '</tr>';
    });
  });
  document.getElementById('content').innerHTML = `<table><tr><th>職務</th><th>姓名</th></tr>${rowsHtml}</table>`;
}

function openModal(team, role, slot, name) {
  currentContext = { team, role, slot, name };
  document.getElementById('modalInfo').textContent = `${team}班「${role}」目前是：${name}`;
  document.getElementById('fName').value = '';
  document.getElementById('fPhone').value = '';
  document.getElementById('fEmail').value = '';
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}

async function submitSwap() {
  const replacementName = document.getElementById('fName').value.trim();
  const replacementEmail = document.getElementById('fEmail').value.trim();
  const replacementPhone = document.getElementById('fPhone').value.trim();
  if (!replacementName || !replacementEmail) {
    showToast('請填姓名跟Email');
    return;
  }
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'swap_submit',
        team: currentContext.team,
        role: currentContext.role,
        slot: currentContext.slot,
        replacementName, replacementPhone, replacementEmail
      })
    });
    const json = await res.json();
    closeModal();
    showToast(json.ok ? json.message : '送出失敗，請稍後再試');
  } catch (e) {
    closeModal();
    showToast('送出失敗，請稍後再試');
  }
}

renderTeamSwitch();
loadRoster('A');
</script>
</body>
</html>
